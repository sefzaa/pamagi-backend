basePath: /
definitions:
  domain.ErrorResponse:
    properties:
      message:
        type: string
    type: object
  domain.SuccessResponse:
    properties:
      message:
        type: string
    type: object
  dto.AuthResponse:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
      user:
        $ref: '#/definitions/dto.UserResponse'
    type: object
  dto.CategoryRes:
    properties:
      icon:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  dto.CategoryResponse:
    properties:
      count:
        type: integer
      icon:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  dto.CreateCategoryRequest:
    properties:
      icon:
        description: Menangkap nama icon dari FE
        type: string
      name:
        type: string
    required:
    - icon
    - name
    type: object
  dto.CreateWordRequest:
    properties:
      category_ids:
        items:
          type: string
        type: array
      examples:
        items:
          $ref: '#/definitions/dto.WordExampleReq'
        maxItems: 3
        type: array
      native_word:
        type: string
      part_of_speech:
        type: string
      targets:
        items:
          $ref: '#/definitions/dto.WordTargetReq'
        maxItems: 2
        minItems: 1
        type: array
    required:
    - native_word
    - part_of_speech
    - targets
    type: object
  dto.ExampleTargetReq:
    properties:
      language_code:
        type: string
      sentence:
        type: string
    required:
    - language_code
    - sentence
    type: object
  dto.ExampleTargetRes:
    properties:
      id:
        type: string
      language_code:
        type: string
      sentence:
        type: string
    type: object
  dto.GenerateFlashcardRequest:
    properties:
      category_ids:
        description: Parameter opsional (tergantung FilterType)
        items:
          type: string
        type: array
      end_date:
        type: string
      filter_type:
        description: 'Opsi: "category", "part_of_speech", "favorite", "date_range",
          "manual", "all"'
        type: string
      parts_of_speech:
        items:
          type: string
        type: array
      sort_by:
        description: 'Opsi: "name_asc", "name_desc", "created_asc", "created_desc",
          "updated_desc"'
        type: string
      start_date:
        description: 'Format: YYYY-MM-DD'
        type: string
      total_questions:
        maximum: 100
        minimum: 1
        type: integer
      word_ids:
        description: Jika pilih manual satu per satu
        items:
          type: string
        type: array
    required:
    - filter_type
    - total_questions
    type: object
  dto.LoginRequest:
    properties:
      identifier:
        description: Ubah Email menjadi Identifier (bisa menampung email atau username)
        type: string
      password:
        type: string
    required:
    - identifier
    - password
    type: object
  dto.NoteDetailResponse:
    properties:
      color:
        type: string
      content:
        description: Isi utuh (Rich text / Delta)
        type: string
      id:
        type: string
      is_favorite:
        type: boolean
      is_pinned:
        type: boolean
      tags:
        items:
          type: string
        type: array
      title:
        type: string
      updated_at:
        type: string
    type: object
  dto.NoteRequest:
    properties:
      color:
        type: string
      content:
        description: String mentah dari editor FE
        type: string
      is_favorite:
        type: boolean
      is_pinned:
        type: boolean
      tags:
        description: 'Array of string untuk nama tag (misal: ["grammar", "vocabulary"])'
        items:
          type: string
        type: array
      title:
        type: string
    required:
    - content
    - title
    type: object
  dto.NoteResponse:
    properties:
      color:
        type: string
      content:
        type: string
      id:
        type: string
      is_favorite:
        type: boolean
      is_pinned:
        type: boolean
      preview:
        type: string
      tags:
        items:
          type: string
        type: array
      title:
        type: string
      updated_at:
        type: string
    type: object
  dto.PaginationMeta:
    properties:
      current_page:
        type: integer
      limit:
        type: integer
      total_items:
        type: integer
      total_pages:
        type: integer
    type: object
  dto.QuizDetailResponse:
    properties:
      examples:
        items:
          $ref: '#/definitions/dto.WordExampleRes'
        type: array
      is_correct:
        type: boolean
      native_word:
        type: string
      part_of_speech:
        type: string
      targets:
        description: 'TAMBAHAN: Menampung array bahasa (Rusia, Inggris, dll)'
        items:
          $ref: '#/definitions/dto.WordTargetRes'
        type: array
      word_id:
        type: string
    type: object
  dto.QuizHistoryResponse:
    properties:
      correct_answers:
        type: integer
      created_at:
        type: string
      details:
        description: omitempty agar null untuk user Free
        items:
          $ref: '#/definitions/dto.QuizDetailResponse'
        type: array
      id:
        type: string
      incorrect_answers:
        type: integer
      score:
        type: number
      status:
        type: string
      total_words:
        type: integer
    type: object
  dto.RefreshTokenRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  dto.RegisterRequest:
    properties:
      email:
        type: string
      name:
        type: string
      native_flag_icon:
        type: string
      native_language:
        type: string
      no_wa:
        type: string
      password:
        minLength: 6
        type: string
      slogan:
        type: string
      target_languages:
        description: Maksimal 2 bahasa
        items:
          $ref: '#/definitions/dto.TargetLanguageReq'
        maxItems: 2
        minItems: 1
        type: array
      username:
        type: string
    required:
    - email
    - name
    - native_flag_icon
    - native_language
    - password
    - target_languages
    - username
    type: object
  dto.SubmitQuizDetail:
    properties:
      is_correct:
        type: boolean
      word_id:
        type: string
    required:
    - word_id
    type: object
  dto.SubmitQuizRequest:
    properties:
      correct_answers:
        type: integer
      details:
        items:
          $ref: '#/definitions/dto.SubmitQuizDetail'
        type: array
      id:
        type: string
      incorrect_answers:
        type: integer
      score:
        type: number
      status:
        description: Tambahkan ini
        enum:
        - IN_PROGRESS
        - COMPLETED
        type: string
      total_words:
        type: integer
    required:
    - status
    - total_words
    type: object
  dto.TargetLanguageReq:
    properties:
      flag_icon:
        type: string
      language_code:
        type: string
      language_name:
        type: string
    required:
    - flag_icon
    - language_code
    - language_name
    type: object
  dto.TargetLanguageRes:
    properties:
      flag_icon:
        type: string
      language_code:
        type: string
      language_name:
        type: string
    type: object
  dto.UpdateWordRequest:
    properties:
      category_ids:
        items:
          type: string
        type: array
      examples:
        items:
          $ref: '#/definitions/dto.WordExampleReq'
        maxItems: 3
        type: array
      native_word:
        type: string
      part_of_speech:
        type: string
      targets:
        items:
          $ref: '#/definitions/dto.WordTargetReq'
        maxItems: 2
        minItems: 1
        type: array
    required:
    - native_word
    - part_of_speech
    - targets
    type: object
  dto.UserResponse:
    properties:
      email:
        type: string
      id:
        type: string
      name:
        type: string
      native_flag_icon:
        type: string
      native_language:
        type: string
      slogan:
        type: string
      subscription_status:
        type: string
      target_languages:
        items:
          $ref: '#/definitions/dto.TargetLanguageRes'
        type: array
      username:
        type: string
    type: object
  dto.WordExampleReq:
    properties:
      native_sentence:
        type: string
      target_sentences:
        items:
          $ref: '#/definitions/dto.ExampleTargetReq'
        type: array
    required:
    - native_sentence
    - target_sentences
    type: object
  dto.WordExampleRes:
    properties:
      id:
        type: string
      native_sentence:
        type: string
      target_sentences:
        items:
          $ref: '#/definitions/dto.ExampleTargetRes'
        type: array
    type: object
  dto.WordPaginationResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/dto.WordResponse'
        type: array
      meta:
        $ref: '#/definitions/dto.PaginationMeta'
    type: object
  dto.WordResponse:
    properties:
      categories:
        items:
          $ref: '#/definitions/dto.CategoryRes'
        type: array
      created_at:
        type: string
      examples:
        items:
          $ref: '#/definitions/dto.WordExampleRes'
        type: array
      id:
        type: string
      is_favorite:
        type: boolean
      native_word:
        type: string
      part_of_speech:
        type: string
      targets:
        items:
          $ref: '#/definitions/dto.WordTargetRes'
        type: array
    type: object
  dto.WordTargetReq:
    properties:
      language_code:
        type: string
      target_word:
        type: string
    required:
    - language_code
    - target_word
    type: object
  dto.WordTargetRes:
    properties:
      id:
        type: string
      language_code:
        type: string
      target_word:
        type: string
    type: object
  dto.WordTypeCountResponse:
    properties:
      count:
        type: integer
      part_of_speech:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: Ini adalah dokumentasi API untuk backend Pamagi.
  title: Pamagi API
  version: "1.0"
paths:
  /categories:
    get:
      description: Menampilkan semua daftar kategori.
      parameters:
      - description: Set true untuk menyembunyikan Uncategorized (digunakan saat input
          kata)
        in: query
        name: for_dropdown
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.CategoryResponse'
            type: array
      security:
      - ApiKeyAuth: []
      summary: Ambil Daftar Kategori
      tags:
      - Categories
    post:
      consumes:
      - application/json
      description: 'Menyimpan kategori baru milik user (misal: "Kata Kerja A1")'
      parameters:
      - description: Data Kategori
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateCategoryRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.CategoryResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Tambah Kategori Baru
      tags:
      - Categories
  /flashcards/generate:
    post:
      consumes:
      - application/json
      description: Mengambil daftar kata berdasarkan filter (maksimal 20 untuk Free,
        diacak jika lebih)
      parameters:
      - description: Filter Flashcard
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.GenerateFlashcardRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.WordResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Dapatkan Soal Flashcard
      tags:
      - Flashcard
  /flashcards/history:
    get:
      description: Menampilkan riwayat kuis user (Detail jawaban hanya muncul jika
        Premium)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.QuizHistoryResponse'
            type: array
      security:
      - ApiKeyAuth: []
      summary: Ambil Histori Kuis
      tags:
      - Flashcard
  /flashcards/history/{id}:
    delete:
      description: Menghapus satu riwayat kuis berdasarkan ID sesi
      parameters:
      - description: ID Session
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.SuccessResponse'
      security:
      - ApiKeyAuth: []
      summary: Hapus Histori Kuis
      tags:
      - Flashcard
  /flashcards/submit:
    post:
      consumes:
      - application/json
      description: Menyimpan skor akhir dan detail jawaban user setelah kuis selesai
      parameters:
      - description: Data Skor Kuis
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.SubmitQuizRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Kirim Hasil Kuis
      tags:
      - Flashcard
  /login:
    post:
      consumes:
      - application/json
      description: Autentikasi user dan mendapatkan JWT token
      parameters:
      - description: Login Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      summary: Login user
      tags:
      - Auth
  /logout:
    post:
      description: Menghapus sesi token pengguna dari sistem (Redis)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.SuccessResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Logout user
      tags:
      - Auth
  /notes:
    get:
      description: Menampilkan semua catatan milik user (diurutkan dari yang dipin
        dan terbaru)
      parameters:
      - description: Sort by (title_asc, created_desc, updated_desc)
        in: query
        name: sort
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.NoteResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Ambil Daftar Catatan
      tags:
      - Note
    post:
      consumes:
      - application/json
      description: Menyimpan catatan baru beserta tag-nya (mendukung format rich text
        dari FE)
      parameters:
      - description: Data Catatan
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.NoteRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Buat Catatan Baru
      tags:
      - Note
  /notes/{id}:
    delete:
      description: Menghapus catatan berdasarkan ID
      parameters:
      - description: ID Catatan
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.SuccessResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Hapus Catatan
      tags:
      - Note
    get:
      description: Mengambil satu catatan beserta isi lengkapnya
      parameters:
      - description: ID Catatan
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.NoteDetailResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Ambil Detail Catatan
      tags:
      - Note
    put:
      consumes:
      - application/json
      description: Memperbarui isi catatan dan tag berdasarkan ID catatan
      parameters:
      - description: ID Catatan
        in: path
        name: id
        required: true
        type: string
      - description: Data Catatan yang Diupdate
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.NoteRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Edit Catatan
      tags:
      - Note
  /notes/{id}/favorite:
    patch:
      description: Menandai atau menghapus tanda favorit pada catatan (hanya mengirim
        ID)
      parameters:
      - description: ID Catatan
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.SuccessResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Toggle Favorite Catatan
      tags:
      - Note
  /notes/{id}/pin:
    patch:
      description: Menyematkan atau melepas sematan catatan (hanya mengirim ID)
      parameters:
      - description: ID Catatan
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.SuccessResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Toggle Pin Catatan
      tags:
      - Note
  /refresh:
    post:
      consumes:
      - application/json
      description: Mendapatkan access token baru menggunakan refresh token tanpa harus
        login ulang
      parameters:
      - description: Refresh Token Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.RefreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      summary: Refresh Access Token
      tags:
      - Auth
  /register:
    post:
      consumes:
      - application/json
      description: Mendaftarkan akun menggunakan email dan password
      parameters:
      - description: Register Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.RegisterRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      summary: Register user baru
      tags:
      - Auth
  /users/me:
    get:
      description: Mendapatkan info profil, bahasa ibu, dan bahasa yang dipelajari
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.UserResponse'
      security:
      - ApiKeyAuth: []
      summary: Ambil Data User Saat Ini
      tags:
      - Profile
  /words:
    get:
      description: Menampilkan daftar kosakata dengan fitur filter kombo (limit 20)
      parameters:
      - description: Filter by Category ID
        in: query
        name: category_id
        type: string
      - description: Filter by Part of Speech (e.g., NOUN)
        in: query
        name: part_of_speech
        type: string
      - description: Filter by Favorite status
        in: query
        name: is_favorite
        type: boolean
      - description: Filter by Bookmark status
        in: query
        name: is_bookmarked
        type: boolean
      - description: Filter by Start Date (YYYY-MM-DD)
        in: query
        name: start_date
        type: string
      - description: Filter by End Date (YYYY-MM-DD)
        in: query
        name: end_date
        type: string
      - description: Sorting (newest, oldest, a_z, z_a)
        in: query
        name: sort_by
        type: string
      - description: 'Nomor Halaman (Default: 1)'
        in: query
        name: page
        type: integer
      - description: 'Jumlah Data per Halaman (Default: 20)'
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.WordPaginationResponse'
      security:
      - ApiKeyAuth: []
      summary: Ambil Daftar Kosakata
      tags:
      - Words
    post:
      consumes:
      - application/json
      description: Menyimpan kosakata beserta contoh kalimat opsional
      parameters:
      - description: Data Kosakata
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateWordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Tambah Kosakata Baru
      tags:
      - Words
  /words/{id}:
    delete:
      description: Menghapus satu kosakata beserta relasi kategori dan contoh kalimatnya
        secara permanen
      parameters:
      - description: ID Kosakata
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.SuccessResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      security:
