basePath: /
definitions:
  domain.ErrorResponse:
    properties:
      message:
        type: string
    type: object
  domain.SuccessResponse:
    properties:
      message:
        type: string
    type: object
  pamagi_domain_dto.AuthResponse:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
      user:
        $ref: '#/definitions/pamagi_domain_dto.UserResponse'
    type: object
  pamagi_domain_dto.CategoryRes:
    properties:
      id:
        type: string
      name:
        type: string
    type: object
  pamagi_domain_dto.CategoryResponse:
    properties:
      id:
        type: string
      name:
        type: string
    type: object
  pamagi_domain_dto.CreateCategoryRequest:
    properties:
      name:
        type: string
    required:
    - name
    type: object
  pamagi_domain_dto.CreateWordRequest:
    properties:
      category_ids:
        description: Array ID kategori (Opsional)
        items:
          type: string
        type: array
      examples:
        description: Array contoh kalimat (Opsional)
        items:
          $ref: '#/definitions/pamagi_domain_dto.ExampleRequest'
        type: array
      part_of_speech:
        type: string
      russian_word:
        type: string
      translation:
        type: string
    required:
    - part_of_speech
    - russian_word
    - translation
    type: object
  pamagi_domain_dto.ExampleRequest:
    properties:
      russian_sentence:
        type: string
      translated_sentence:
        type: string
    required:
    - russian_sentence
    - translated_sentence
    type: object
  pamagi_domain_dto.LoginRequest:
    properties:
      identifier:
        description: Ubah Email menjadi Identifier (bisa menampung email atau username)
        type: string
      password:
        type: string
    required:
    - identifier
    - password
    type: object
  pamagi_domain_dto.RegisterRequest:
    properties:
      email:
        type: string
      name:
        type: string
      no_wa:
        type: string
      password:
        minLength: 6
        type: string
      region:
        type: string
      username:
        type: string
    required:
    - email
    - name
    - password
    - username
    type: object
  pamagi_domain_dto.UserResponse:
    properties:
      email:
        type: string
      id:
        type: string
      name:
        type: string
      username:
        type: string
    type: object
  pamagi_domain_dto.WordExampleRes:
    properties:
      id:
        type: string
      russian_sentence:
        type: string
      translated_sentence:
        type: string
    type: object
  pamagi_domain_dto.WordResponse:
    properties:
      categories:
        items:
          $ref: '#/definitions/pamagi_domain_dto.CategoryRes'
        type: array
      created_at:
        type: string
      examples:
        items:
          $ref: '#/definitions/pamagi_domain_dto.WordExampleRes'
        type: array
      id:
        type: string
      is_favorite:
        type: boolean
      part_of_speech:
        type: string
      russian_word:
        type: string
      translation:
        type: string
    type: object
host: pamagi.mydm.cloud
info:
  contact: {}
  description: Ini adalah dokumentasi API untuk backend Pamagi.
  title: Pamagi API
  version: "1.0"
paths:
  /categories:
    get:
      description: Menampilkan semua daftar kategori milik user yang sedang login
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/pamagi_domain_dto.CategoryResponse'
            type: array
      security:
      - ApiKeyAuth: []
      summary: Ambil Daftar Kategori
      tags:
      - Categories
    post:
      consumes:
      - application/json
      description: 'Menyimpan kategori baru milik user (misal: "Kata Kerja A1")'
      parameters:
      - description: Data Kategori
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/pamagi_domain_dto.CreateCategoryRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/pamagi_domain_dto.CategoryResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Tambah Kategori Baru
      tags:
      - Categories
  /login:
    post:
      consumes:
      - application/json
      description: Autentikasi user dan mendapatkan JWT token
      parameters:
      - description: Login Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/pamagi_domain_dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/pamagi_domain_dto.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      summary: Login user
      tags:
      - Auth
  /logout:
    post:
      description: Menghapus sesi token pengguna dari sistem (Redis)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.SuccessResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Logout user
      tags:
      - Auth
  /register:
    post:
      consumes:
      - application/json
      description: Mendaftarkan akun menggunakan email dan password
      parameters:
      - description: Register Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/pamagi_domain_dto.RegisterRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      summary: Register user baru
      tags:
      - Auth
  /words:
    get:
      description: Menampilkan daftar kosakata dengan fitur filter
      parameters:
      - description: Filter by Category ID
        in: query
        name: category_id
        type: string
      - description: Filter by Part of Speech (e.g., NOUN)
        in: query
        name: part_of_speech
        type: string
      - description: Filter by Favorite status
        in: query
        name: is_favorite
        type: boolean
      - description: Sorting (newest, oldest)
        in: query
        name: sort_by
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/pamagi_domain_dto.WordResponse'
            type: array
      security:
      - ApiKeyAuth: []
      summary: Ambil Daftar Kosakata
      tags:
      - Words
    post:
      consumes:
      - application/json
      description: Menyimpan kosakata beserta contoh kalimat opsional
      parameters:
      - description: Data Kosakata
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/pamagi_domain_dto.CreateWordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Tambah Kosakata Baru
      tags:
      - Words
  /words/{id}/favorite:
    put:
      description: Menandai atau menghapus tanda favorit pada suatu kata
      parameters:
      - description: ID Kosakata
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.SuccessResponse'
      security:
      - ApiKeyAuth: []
      summary: Ubah Status Favorit
      tags:
      - Words
securityDefinitions:
  ApiKeyAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
