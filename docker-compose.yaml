version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: pamagi_app
    ports:
      - "8080:8080"
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - pamagi_network

  mysql:
    image: mysql:8.0
    container_name: pamagi_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pamagi_network

  redis:
    image: redis:7-alpine
    container_name: pamagi_redis
    ports:
      - "6380:6379"
    networks:
      - pamagi_network

# ---  GUI TOOLS ---
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: pamagi_phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: root_password
    ports:
      - "5050:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - pamagi_network

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: pamagi_redis_commander
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis
    networks:
      - pamagi_network

volumes:
  mysql_data:

networks:
  pamagi_network:
    driver: bridge